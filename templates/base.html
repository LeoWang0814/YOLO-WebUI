<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}YOLOv10 Workbench{% endblock %}</title>
  <script>
    (() => {
      const preference = localStorage.getItem("yolov10-workbench.theme") || "system";
      const theme = preference === "system"
        ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : preference;
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.themePreference = preference;
      const savedLanguage = localStorage.getItem("yolov10-workbench.language");
      const language = savedLanguage || (navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en");
      document.documentElement.dataset.language = language;
      document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
    })();
  </script>
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
  <script src="/assets/plotly.min.js"></script>
  <script defer src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/vendor/lucide.min.js"></script>
  <script defer src="/static/js/i18n.js?v={{ asset_version }}"></script>
  <script defer src="/static/js/app.js?v={{ asset_version }}"></script>
</head>
<body>
  <div class="application-shell">
    <header class="topbar">
      <div class="wordmark" aria-label="YOLOv10 Workbench">
        <span class="wordmark-name">YOLO</span><span class="wordmark-version">v10</span>
      </div>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="/?operation=train" {% if current_page == 'train' %}aria-current="page"{% endif %}><i data-lucide="graduation-cap"></i>Train</a>
        <a href="/?operation=predict" {% if current_page == 'predict' %}aria-current="page"{% endif %}><i data-lucide="scan-line"></i>Predict</a>
        <a href="/runs" {% if current_page == 'runs' %}aria-current="page"{% endif %}><i data-lucide="history"></i>Runs</a>
        <a href="/docs" {% if current_page == 'docs' %}aria-current="page"{% endif %}><i data-lucide="book-open"></i>Docs</a>
      </nav>
      <div class="topbar-actions">
        <div id="runtime-status" hx-get="/fragments/runtime" hx-trigger="load, every 30s" hx-swap="outerHTML"></div>
        <div class="theme-menu" aria-label="Theme">
          <button class="icon-button" type="button" data-theme-toggle aria-label="Switch theme" title="Switch theme"><i data-lucide="sun-moon"></i></button>
        </div>
        <button class="language-toggle" type="button" data-language-toggle aria-label="Switch language" title="Switch language"><span data-language-zh>中</span><i>/</i><span data-language-en>En</span></button>
      </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <div id="app-feedback" class="feedback-region" role="status" aria-live="polite"></div>
    <div id="media-viewer" class="media-viewer" hidden aria-hidden="true">
      <div class="media-viewer-backdrop" data-viewer-close></div>
      <section class="media-viewer-dialog" role="dialog" aria-modal="true" aria-label="Media viewer">
        <header class="media-viewer-header">
          <div class="media-viewer-title"><span class="panel-kicker">Preview</span><h2 data-viewer-title>Media</h2></div>
          <div class="media-viewer-actions">
            <button class="viewer-icon-button" type="button" data-viewer-zoom-out aria-label="Zoom out" title="Zoom out"><i data-lucide="zoom-out"></i></button>
            <button class="viewer-icon-button" type="button" data-viewer-reset aria-label="Fit image to view" title="Fit image to view"><i data-lucide="scan"></i></button>
            <button class="viewer-icon-button" type="button" data-viewer-zoom-in aria-label="Zoom in" title="Zoom in"><i data-lucide="zoom-in"></i></button>
            <button class="viewer-icon-button viewer-close" type="button" data-viewer-close aria-label="Close viewer" title="Close viewer"><i data-lucide="x"></i></button>
          </div>
        </header>
        <div class="media-viewer-stage" data-viewer-stage>
          <img data-viewer-image alt="" draggable="false" hidden>
          <video data-viewer-video controls playsinline hidden></video>
          <div class="media-viewer-empty" data-viewer-empty hidden><i data-lucide="image-off"></i><span>Media unavailable</span></div>
        </div>
        <footer class="media-viewer-footer">
          <span data-viewer-caption>Fit to view</span>
          <a data-viewer-open target="_blank" rel="noreferrer">Open original <i data-lucide="arrow-up-right"></i></a>
        </footer>
      </section>
    </div>
  </div>
</body>
</html>
