<div id="runtime-status" class="runtime-status" aria-label="Runtime status" {% if runtime.cuda_hint %}title="{{ runtime.cuda_hint }}"{% endif %}>
  <span class="status-dot {% if runtime.cuda == 'available' %}is-ready{% endif %}"></span>
  <span><strong>{% if runtime.cuda == 'incompatible' %}GPU issue{% elif runtime.cuda == 'available' %}GPU{% else %}CPU{% endif %}</strong></span>
  <span class="runtime-detail">Torch {{ runtime.torch }}</span>
  {% if runtime.gpu_list %}<span class="runtime-detail">{{ runtime.compatible_gpu_count }}/{{ runtime.gpu_list | length }} GPU</span>{% endif %}
</div>
