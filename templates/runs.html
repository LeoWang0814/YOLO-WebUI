{% extends 'base.html' %}
{% block title %}Runs - YOLOv10 Workbench{% endblock %}
{% block content %}
<section class="page-heading">
  <h1>Runs</h1>
  <a class="button button-primary" href="/?operation=train"><i data-lucide="plus"></i>New run</a>
</section>
<div class="runs-toolbar">
  <label class="run-search"><i data-lucide="search"></i><input type="search" data-run-search aria-label="Search runs" placeholder="Search runs"></label>
  <div class="segmented run-filter" data-run-filter aria-label="Filter runs">
    <label><input type="radio" name="run_filter" value="all" checked><span>All</span></label>
    <label><input type="radio" name="run_filter" value="train"><span>Train</span></label>
    <label><input type="radio" name="run_filter" value="predict"><span>Predict</span></label>
  </div>
</div>
<section class="run-list">
  <div class="run-list-header"><span>Type</span><span>Name</span><span>Updated</span><span>Artifacts</span><span></span></div>
  {% for run in runs %}<a class="run-row" data-run-row data-run-kind="{{ run.kind }}" data-run-name="{{ run.name | lower }}" href="/runs/{{ run.kind }}/{{ run.name }}"><span class="run-kind">{{ run.kind }}</span><strong>{{ run.name }}</strong><span>{{ run.updated }}</span><span>{{ run.artifacts }}</span><i data-lucide="chevron-right"></i></a>{% else %}<div class="empty-output compact-empty"><i data-lucide="folder-open"></i><span>No local runs</span></div>{% endfor %}
  <div class="empty-output compact-empty" data-run-empty hidden><i data-lucide="search-x"></i><span>No matching runs</span></div>
</section>
{% endblock %}
